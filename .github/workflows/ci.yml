name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + lint)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rackmon
          POSTGRES_PASSWORD: rackmon
          POSTGRES_DB: rackmon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rackmon"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes
      - name: Lint (pyflakes)
        run: python -m pyflakes app
      - name: Tests on SQLite
        run: python -m pytest
      - name: Tests on PostgreSQL + Redis
        env:
          RACKMON_TEST_DATABASE_URL: postgresql+psycopg2://rackmon:rackmon@localhost:5432/rackmon
          RACKMON_TEST_REDIS_URL: redis://localhost:6379/15
        run: python -m pytest

  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build

  cross-browser:
    name: Cross-browser E2E (Chromium + Firefox + WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Build frontend into backend/app/static
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install Playwright browsers (Chromium, Firefox, WebKit)
        working-directory: frontend
        # `--with-deps` instala paquetes del sistema con apt, y esa lista va
        # atada a la version de Ubuntu que conocia Playwright cuando se publico.
        # Cuando el runner adelanta de version, ese paso revienta aunque las
        # bibliotecas ya esten en la imagen — que en los runners de GitHub lo
        # estan. Si falla, se instalan solo los motores: si de verdad faltara
        # alguna biblioteca, el paso siguiente lo dira claro al abrir el
        # navegador, en vez de morir en un apt-get.
        run: |
          npx playwright install --with-deps chromium firefox webkit \
            || npx playwright install chromium firefox webkit
      - name: Start backend (serves API + SPA)
        working-directory: backend
        env:
          RACKMON_SEED_DEMO_DATA: "true"
          RACKMON_JWT_SECRET: ci-secret
          RACKMON_MASTER_KEY: ci-master-key
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Run Playwright on all three engines
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/e2e/report
          # Si el trabajo muere antes de que Playwright escriba nada, no hay
          # informe que subir y eso no es un aviso que merezca la pena leer.
          if-no-files-found: ignore

  kubernetes:
    name: Helm install on real Kubernetes (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a real kind cluster
        uses: helm/kind-action@v1
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Build the backend image
        run: docker build -t rackmon:ci -f backend/Dockerfile .
      - name: Load the image into the kind cluster
        run: kind load docker-image rackmon:ci --name chart-testing
      - name: helm install onto the cluster
        run: |
          # Los valores por defecto del chart son "change-me" a proposito, y
          # RackMon los rechaza en CUALQUIER entorno: esa cadena esta publicada
          # en las plantillas de instalacion, asi que quien la deje tiene una
          # clave de firma que cualquiera puede leer. Aqui hay que dar valores
          # de verdad, igual que tendria que hacer cualquiera que despliegue.
          # Sin esto el pod no arranca y `--wait` agota su tiempo sin decir por que.
          helm install rackmon ./deploy/helm/rackmon \
            --set image.repository=rackmon \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set ingress.enabled=false \
            --set secrets.jwtSecret="$(openssl rand -hex 32)" \
            --set secrets.masterKey="$(openssl rand -hex 32)" \
            --set secrets.dbPassword="$(openssl rand -hex 16)" \
            --set secrets.adminEmail=ci@example.invalid \
            --set secrets.adminPassword="$(openssl rand -hex 18)" \
            --wait --timeout 5m
      - name: Verify pods actually run
        if: always()
        run: |
          kubectl get pods -A -o wide
          kubectl wait --for=condition=available --timeout=300s deployment --all || true
          kubectl describe pods -l app.kubernetes.io/instance=rackmon || true
