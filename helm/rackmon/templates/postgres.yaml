{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rackmon.fullname" . }}-postgres
  labels: {{- include "rackmon.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rackmon.fullname" . }}-postgres
  labels: {{- include "rackmon.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rackmon.name" . }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rackmon.name" . }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: rackmon
            - name: POSTGRES_DB
              value: rackmon
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "rackmon.secretName" . }}, key: DB_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "rackmon.fullname" . }}-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rackmon.fullname" . }}-postgres
  labels: {{- include "rackmon.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "rackmon.name" . }}
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
