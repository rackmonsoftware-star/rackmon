apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rackmon.fullname" . }}-api
  labels: {{- include "rackmon.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rackmon.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rackmon.name" . }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: {{ include "rackmon.fullname" . }}-config }
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "rackmon.secretName" . }}, key: DB_PASSWORD }
            - name: RACKMON_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "rackmon.secretName" . }}, key: RACKMON_JWT_SECRET }
            - name: RACKMON_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "rackmon.secretName" . }}, key: RACKMON_MASTER_KEY }
            - name: RACKMON_DATABASE_URL
              value: {{ include "rackmon.databaseUrl" . | quote }}
            - name: RACKMON_POLLER_ENABLED
              value: {{ .Values.api.pollerEnabled | quote }}
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rackmon.fullname" . }}-api
  labels: {{- include "rackmon.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "rackmon.name" . }}
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: 8000
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rackmon.fullname" . }}-api
  labels: {{- include "rackmon.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rackmon.fullname" . }}-api
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.poller.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rackmon.fullname" . }}-poller
  labels: {{- include "rackmon.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rackmon.name" . }}
      app.kubernetes.io/component: poller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rackmon.name" . }}
        app.kubernetes.io/component: poller
    spec:
      containers:
        - name: poller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef: { name: {{ include "rackmon.fullname" . }}-config }
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "rackmon.secretName" . }}, key: DB_PASSWORD }
            - name: RACKMON_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "rackmon.secretName" . }}, key: RACKMON_JWT_SECRET }
            - name: RACKMON_MASTER_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "rackmon.secretName" . }}, key: RACKMON_MASTER_KEY }
            - name: RACKMON_DATABASE_URL
              value: {{ include "rackmon.databaseUrl" . | quote }}
            - name: RACKMON_POLLER_USE_SIMULATOR
              value: {{ .Values.poller.useSimulator | quote }}
{{- end }}
