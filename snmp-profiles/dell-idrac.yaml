# IDRAC-MIB
vendor: "Dell"
applies_to: "PowerEdge servers with iDRAC (7/8/9)"

oids:
  - name: temperatureProbeReading
    oid: 1.3.6.1.4.1.674.10892.5.4.700.20.1.6
    description: "Temperature probe reading. TENTHS of a degree."
  - name: temperatureProbeLocationName
    oid: 1.3.6.1.4.1.674.10892.5.4.700.20.1.8
    description: "Probe name, e.g. 'System Board Inlet Temp'."
  - name: temperatureProbeStatus
    oid: 1.3.6.1.4.1.674.10892.5.4.700.20.1.5
    description: "3 = ok. Discard readings that aren't."

scaling: "DIVIDE BY 10. A returned 275 is 27.5 C. This is the single most common mistake with iDRAC."
units: "Celsius."

notes: |
  Index 1 is normally 'System Board Inlet Temp' — that is the one you want for room/rack
  monitoring. Higher indexes are CPU and exhaust probes, which run much hotter and will give you
  a misleading picture of your cooling if you alert on them.
